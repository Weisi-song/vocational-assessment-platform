<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8f1d22">
  <meta name="description" content="职业发展评估与成长档案系统脱敏演示版">
  <title>职业发展评估与成长档案系统 · Demo</title>
  <style>
    :root {
      --paper: #f7f3ef;
      --surface: #fffdfb;
      --ink: #241f1f;
      --muted: #746d69;
      --line: #e6ddd7;
      --red: #9f2026;
      --red-dark: #741419;
      --red-soft: #f7e8e8;
      --gold: #c79545;
      --blue: #4b8bb4;
      --green: #58956b;
      --coral: #d47265;
      --shadow: 0 18px 45px rgba(72, 43, 34, .08);
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(75, 139, 180, .35); outline-offset: 3px; }
    .demo-strip { padding: 8px 16px; color: #6c4b26; background: #fbf0d8; border-bottom: 1px solid #ead4a7; font-size: 12px; text-align: center; }
    .app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 70px; padding: 12px max(24px, calc((100vw - 1240px) / 2)); background: rgba(255,253,251,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 12px; border: 0; color: inherit; background: transparent; text-align: left; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; color: #fff; background: var(--red); border-radius: 13px 13px 13px 4px; font: 700 17px/1 Georgia, serif; }
    .brand strong { display: block; font: 700 16px/1.25 "Songti SC", "STSong", serif; }
    .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .main-nav { display: flex; gap: 4px; }
    .nav-button { padding: 9px 14px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 13px; }
    .nav-button:hover, .nav-button.active { color: var(--red); background: var(--red-soft); }
    .header-tools { display: flex; align-items: center; gap: 10px; }
    .user-chip { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .avatar { display: grid; width: 34px; height: 34px; place-items: center; color: var(--red); background: var(--red-soft); border: 1px solid #f0d2d3; border-radius: 50%; font-weight: 700; }
    main { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 70px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font: 700 clamp(27px, 4vw, 40px)/1.18 "Songti SC", "STSong", serif; letter-spacing: -.03em; }
    h2 { font: 700 22px/1.3 "Songti SC", "STSong", serif; }
    h3 { font-size: 15px; }
    .page-subtitle { max-width: 700px; margin-bottom: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; font-weight: 600; font-size: 13px; }
    .button:hover { border-color: #d4c2b9; transform: translateY(-1px); }
    .button.primary { color: #fff; background: var(--red); border-color: var(--red); }
    .button.primary:hover { background: var(--red-dark); }
    .button.ghost { background: transparent; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat { position: relative; overflow: hidden; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 24px rgba(72,43,34,.04); }
    .stat::before { position: absolute; top: 0; right: 0; width: 48px; height: 4px; content: ""; background: var(--accent, var(--red)); }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 9px; font: 700 28px/1 "Songti SC", serif; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; }
    .search { width: min(280px, 45vw); padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .student-list { display: grid; }
    .student-row { display: grid; grid-template-columns: minmax(250px,1.5fr) 1fr 1fr auto; align-items: center; gap: 20px; width: 100%; padding: 20px 22px; border: 0; border-bottom: 1px solid var(--line); color: inherit; background: transparent; text-align: left; }
    .student-row:last-child { border-bottom: 0; }
    .student-row:hover { background: #fff8f7; }
    .student-ident { display: flex; align-items: center; gap: 14px; }
    .student-monogram { display: grid; width: 46px; height: 46px; place-items: center; color: var(--red); background: var(--red-soft); border-radius: 50%; font: 700 18px/1 "Songti SC", serif; }
    .student-ident strong { display: block; margin-bottom: 5px; }
    .student-ident span, .row-meta { color: var(--muted); font-size: 12px; }
    .period-dots { display: flex; gap: 7px; }
    .period-dot { width: 11px; height: 11px; border: 2px solid #d9cfca; border-radius: 50%; background: #fff; }
    .period-dot.done { border-color: var(--red); background: var(--red); }
    .period-dot.current { border-color: var(--gold); box-shadow: inset 0 0 0 2px #fff; background: var(--gold); }
    .arrow { color: var(--red); font-size: 20px; }
    .back { margin-bottom: 18px; }
    .profile-hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; margin-bottom: 20px; }
    .profile-card { padding: 26px; background: linear-gradient(145deg, #86191f, #a92c31); border-radius: 20px; color: #fff; box-shadow: 0 24px 50px rgba(116,20,25,.19); }
    .profile-card .eyebrow { color: #f0c8c8; }
    .profile-name { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .profile-name .student-monogram { width: 58px; height: 58px; color: #fff; background: rgba(255,255,255,.14); }
    .profile-name h1 { margin: 0 0 4px; }
    .profile-name p { margin: 0; color: #f1dcdc; font-size: 13px; }
    .profile-facts { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
    .profile-facts span { display: block; color: #e8bfc0; font-size: 11px; }
    .profile-facts strong { display: block; margin-top: 5px; font-size: 13px; }
    .next-card { display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
    .next-card p { color: var(--muted); font-size: 13px; line-height: 1.65; }
    .timeline { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; padding: 20px; }
    .period-card { position: relative; min-height: 170px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .period-card.done { border-color: #e8c5c7; background: #fff9f8; }
    .period-card.current { border-color: #ddbc79; background: #fffaf0; }
    .period-number { display: grid; width: 30px; height: 30px; place-items: center; margin-bottom: 18px; border-radius: 50%; color: var(--muted); background: #f1ece8; font-size: 12px; font-weight: 700; }
    .period-card.done .period-number { color: #fff; background: var(--red); }
    .period-card.current .period-number { color: #fff; background: var(--gold); }
    .period-card strong { display: block; margin-bottom: 7px; font-size: 13px; }
    .period-card p { margin-bottom: 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .period-score { color: var(--red); font: 700 22px/1 "Songti SC", serif; }
    .assessment-layout { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 18px; align-items: start; }
    .assessment-form { overflow: hidden; }
    .dimension { border-bottom: 1px solid var(--line); }
    .dimension:last-child { border-bottom: 0; }
    .dimension-head { display: flex; justify-content: space-between; gap: 16px; padding: 20px 22px 12px; }
    .dimension-title { display: flex; align-items: center; gap: 10px; }
    .dimension-color { width: 9px; height: 30px; border-radius: 99px; background: var(--dimension); }
    .dimension-title h3 { margin: 0 0 3px; }
    .dimension-title p { margin: 0; color: var(--muted); font-size: 11px; }
    .dimension-average { color: var(--dimension); font: 700 22px/1.2 "Songti SC", serif; }
    .indicator { display: grid; grid-template-columns: minmax(230px,1fr) minmax(220px,.8fr) 38px; align-items: center; gap: 18px; padding: 13px 22px; }
    .indicator:hover { background: #fbf8f5; }
    .indicator label { font-size: 13px; line-height: 1.5; }
    .indicator small { display: block; margin-top: 3px; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--red); }
    .score-badge { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-weight: 700; }
    .assessment-aside { position: sticky; top: 94px; padding: 20px; }
    .completion-ring { display: grid; width: 112px; height: 112px; margin: 8px auto 18px; place-items: center; border-radius: 50%; background: conic-gradient(var(--red) var(--progress), #eee5df 0); }
    .completion-ring::before { grid-area: 1/1; width: 88px; height: 88px; content: ""; background: var(--surface); border-radius: 50%; }
    .completion-ring strong { z-index: 1; grid-area: 1/1; font: 700 25px/1 "Songti SC", serif; }
    .scale-note { margin: 18px 0; padding: 13px; color: var(--muted); background: #f8f3ef; border-radius: 10px; font-size: 11px; line-height: 1.7; }
    .aside-actions { display: grid; gap: 9px; }
    .report-cover { padding: 30px; color: #fff; background: linear-gradient(145deg, #85181d, #aa3034); border-radius: 20px; box-shadow: 0 24px 50px rgba(116,20,25,.18); }
    .report-cover-top { display: flex; justify-content: space-between; gap: 20px; }
    .report-cover .eyebrow { color: #f0c8c8; }
    .report-cover h1 { margin-bottom: 22px; }
    .report-tag { align-self: flex-start; padding: 9px 13px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; font-size: 12px; }
    .report-meta { display: grid; grid-template-columns: repeat(5,1fr); gap: 18px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.18); }
    .report-meta span { display: block; color: #edc6c7; font-size: 10px; }
    .report-meta strong { display: block; margin-top: 6px; font-size: 13px; }
    .report-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 18px; margin-top: 18px; }
    .chart-card, .summary-card { padding: 22px; }
    .chart-card canvas { display: block; width: 100%; height: 300px; }
    .dimension-legend { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 10px; }
    .legend-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; background: #f9f5f2; border-radius: 9px; font-size: 11px; }
    .legend-item i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--legend); }
    .summary-card blockquote { margin: 0 0 20px; padding: 18px; background: #fff7f5; border-left: 4px solid var(--red); border-radius: 0 12px 12px 0; font: 600 14px/1.8 "Songti SC", serif; }
    .insight-list { display: grid; gap: 10px; }
    .insight { padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; }
    .insight strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .insight p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .report-tabs { display: flex; gap: 6px; margin: 22px 0 14px; }
    .report-tab { padding: 10px 15px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: #fff; }
    .report-tab.active { color: #fff; background: var(--red); border-color: var(--red); }
    .trend-panel { padding: 22px; }
    .trend-panel canvas { width: 100%; height: 320px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 60; padding: 12px 16px; color: #fff; background: #2f2927; border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .empty-note { padding: 50px 20px; color: var(--muted); text-align: center; }
    @media (max-width: 900px) {
      .main-nav { display: none; }
      .stats { grid-template-columns: repeat(2,1fr); }
      .student-row { grid-template-columns: 1fr auto; }
      .student-row .row-meta { display: none; }
      .profile-hero, .report-grid, .assessment-layout { grid-template-columns: 1fr; }
      .assessment-aside { position: static; }
      .timeline { grid-template-columns: 1fr 1fr; }
      .report-meta, .profile-facts { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 560px) {
      .app-header { padding: 10px 16px; }
      .brand small, .user-chip span { display: none; }
      main { width: min(100% - 24px, 1240px); padding-top: 24px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { padding: 15px; }
      .student-row { padding: 16px; }
      .timeline { grid-template-columns: 1fr; }
      .indicator { grid-template-columns: 1fr 38px; gap: 10px; }
      .indicator input { grid-column: 1 / -1; grid-row: 2; }
      .report-cover { padding: 22px; }
      .report-cover-top { flex-direction: column; }
    }
    @media print {
      .demo-strip, .app-header, .back, .page-head .button, .report-tabs, .toast { display: none !important; }
      body { background: #fff; }
      main { width: 100%; padding: 0; }
      .panel { box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="demo-strip">作品集演示版 · 所有人物、学校、评估内容与数据均为虚构，不对应任何真实学生或机构</div>
  <header class="app-header">
    <button class="brand" onclick="showStudents()" aria-label="返回学生档案首页">
      <span class="brand-mark">IV</span>
      <span><strong>职业发展评估与成长档案系统</strong><small>Individualized Vocational Education Support</small></span>
    </button>
    <nav class="main-nav" aria-label="主导航">
      <button class="nav-button active" data-nav="students" onclick="showStudents()">学生档案</button>
      <button class="nav-button" data-nav="workflow" onclick="showWorkflow()">工作流程</button>
      <button class="nav-button" onclick="showToast('演示数据已在当前页面重置')">重置演示</button>
    </nav>
    <div class="header-tools"><div class="user-chip"><span>启航职业学校 · 李老师</span><span class="avatar">李</span></div></div>
  </header>
  <main id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const dimensions = [
      { name: '职业意向认知', short: '意向认知', color: '#d47265', description: '认识职业、自我与工作价值', indicators: ['能说出自己感兴趣的工作类型','能辨认常见职业及主要任务','能表达自己喜欢和不喜欢的工作内容','理解工作与收入、责任的基本关系','能根据自身特点作出初步职业选择'] },
      { name: '通用职业素养', short: '通用素养', color: '#c79545', description: '规则、沟通、合作与任务习惯', indicators: ['能按约定时间到达工作地点','能理解并执行两至三步任务指令','遇到不清楚的问题会主动询问','能与同伴分工完成共同任务','能在提醒下遵守安全和卫生规范'] },
      { name: '职场适应能力', short: '职场适应', color: '#4b8bb4', description: '环境适应、问题处理与支持使用', indicators: ['能适应工作场所的声音和人员变化','任务出错后能接受提示并重新尝试','能使用图示或清单完成连续任务','能识别需要帮助的情境并求助','面对计划调整时能在支持下转换任务'] },
      { name: '职业生涯规划', short: '生涯规划', color: '#58956b', description: '目标、行动与成长反思', indicators: ['能描述一个近期想要提升的能力','能参与制定简单的训练目标','能记录自己完成过的工作任务','能根据反馈调整下一次行动','能说出实习或就业前需要的准备'] }
    ];

    const students = [
      { id: 1, name: '林晨曦', gender: '女', grade: '高三·1班', teacher: '李老师', school: '启航职业学校（演示）', completed: 5, latest: 3.18, updated: '2026-06-18', periods: [[2.0,2.2,1.8,1.6],[2.2,2.5,2.1,1.9],[2.5,2.7,2.4,2.2],[2.8,3.0,2.7,2.5],[3.2,3.4,3.1,3.0]] },
      { id: 2, name: '陈雨桐', gender: '女', grade: '高二·3班', teacher: '周老师', school: '启航职业学校（演示）', completed: 3, latest: 2.63, updated: '2026-05-27', periods: [[1.8,2.0,1.7,1.5],[2.2,2.4,2.0,1.9],[2.7,2.8,2.6,2.4]] },
      { id: 3, name: '周子涵', gender: '男', grade: '高一·2班', teacher: '王老师', school: '启航职业学校（演示）', completed: 1, latest: 2.03, updated: '2026-04-12', periods: [[2.1,2.3,1.9,1.8]] },
      { id: 4, name: '沈星野', gender: '男', grade: '高一·4班', teacher: '孙老师', school: '启航职业学校（演示）', completed: 0, latest: null, updated: '尚未评估', periods: [] }
    ];

    const app = document.getElementById('app');
    let currentStudent = students[0];
    let assessmentScores = dimensions.map((dimension, d) => dimension.indicators.map((_, i) => Math.min(4, 1 + ((d + i) % 4))));
    let reportMode = 'current';
    let currentReportValues = currentStudent.periods[4];

    function setNav(name) {
      document.querySelectorAll('[data-nav]').forEach(button => button.classList.toggle('active', button.dataset.nav === name));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function formatScore(value) { return value == null ? '—' : Number(value).toFixed(2); }
    function dots(completed) { return Array.from({length:5}, (_,i) => `<span class="period-dot ${i < completed ? 'done' : i === completed && completed < 5 ? 'current' : ''}"></span>`).join(''); }

    function showStudents() {
      setNav('students');
      app.innerHTML = `
        <section class="page-head"><div><p class="eyebrow">Student records</p><h1>学生成长档案</h1><p class="page-subtitle">集中查看学生的评估进度、最新结果和多学期成长变化。选择任意学生进入完整演示。</p></div><button class="button primary" onclick="showToast('公开演示版已关闭新建真实档案功能')">＋ 新建学生档案</button></section>
        <section class="stats">
          <article class="stat" style="--accent:var(--red)"><span>在档学生</span><strong>4</strong></article>
          <article class="stat" style="--accent:var(--gold)"><span>本学期已完成评估</span><strong>3</strong></article>
          <article class="stat" style="--accent:var(--blue)"><span>累计评估报告</span><strong>9</strong></article>
          <article class="stat" style="--accent:var(--green)"><span>待开始评估</span><strong>1</strong></article>
        </section>
        <section class="panel"><div class="panel-head"><h2>全部学生</h2><input class="search" aria-label="搜索学生" placeholder="搜索姓名、年级或班级" oninput="filterStudents(this.value)"></div><div class="student-list" id="studentList">${students.map(studentRow).join('')}</div></section>`;
    }
    function studentRow(student) {
      return `<button class="student-row" data-search="${student.name}${student.grade}${student.teacher}" onclick="showStudent(${student.id})">
        <span class="student-ident"><span class="student-monogram">${student.name.slice(-1)}</span><span><strong>${student.name}</strong><span>${student.school} · ${student.grade}</span></span></span>
        <span class="row-meta">班主任<br><strong style="color:var(--ink);font-size:13px">${student.teacher}</strong></span>
        <span><span class="row-meta">评估进度</span><span class="period-dots" style="margin-top:8px">${dots(student.completed)}</span></span>
        <span class="arrow">→</span></button>`;
    }
    function filterStudents(value) {
      const query = value.trim().toLowerCase();
      document.querySelectorAll('.student-row').forEach(row => row.hidden = !row.dataset.search.toLowerCase().includes(query));
    }
    function showWorkflow() {
      setNav('workflow');
      app.innerHTML = `<section class="page-head"><div><p class="eyebrow">Workflow</p><h1>从评估到成长计划</h1><p class="page-subtitle">系统把原本分散的评分、算分、制图、报告和档案管理连成一条连续工作流。</p></div></section>
      <section class="panel" style="padding:28px"><div class="timeline">${['建立学生档案','完成指标评估','自动计算与分析','生成评估报告','对比五次成长'].map((item,index)=>`<article class="period-card done"><span class="period-number">${index+1}</span><strong>${item}</strong><p>${['集中保存基本信息与支持背景','按维度完成代表性指标评分','形成维度得分与优势薄弱项','生成可打印的可视化报告','支持下一阶段培养目标制定'][index]}</p></article>`).join('')}</div><div style="text-align:center;padding:8px 0 10px"><button class="button primary" onclick="showStudent(1)">进入学生档案体验</button></div></section>`;
    }
    function showStudent(id) {
      currentStudent = students.find(student => student.id === id) || students[0];
      setNav('students');
      const next = Math.min(currentStudent.completed + 1, 5);
      app.innerHTML = `<button class="button ghost back" onclick="showStudents()">← 返回学生列表</button>
        <section class="profile-hero">
          <article class="profile-card"><p class="eyebrow">Student profile</p><div class="profile-name"><span class="student-monogram">${currentStudent.name.slice(-1)}</span><div><h1>${currentStudent.name}</h1><p>${currentStudent.school} · ${currentStudent.grade}</p></div></div><div class="profile-facts"><div><span>性别</span><strong>${currentStudent.gender}</strong></div><div><span>班主任</span><strong>${currentStudent.teacher}</strong></div><div><span>累计评估</span><strong>${currentStudent.completed} 次</strong></div><div><span>最近更新</span><strong>${currentStudent.updated}</strong></div></div></article>
          <article class="panel next-card"><div><p class="eyebrow">Next action</p><h2>${currentStudent.completed >= 5 ? '五次评估已完成' : `开始第 ${next} 次评估`}</h2><p>${currentStudent.completed >= 5 ? '查看完整成长趋势，结合维度变化制定离校前的支持重点。' : '使用公开版代表性指标体验评分、自动计算和报告生成。'}</p></div><button class="button primary" onclick="${currentStudent.completed >= 5 ? 'showReport(1)' : 'startAssessment()'}">${currentStudent.completed >= 5 ? '查看成长报告' : '开始评估'} →</button></article>
        </section>
        <section class="panel"><div class="panel-head"><div><p class="eyebrow">Assessment timeline</p><h2>五次评估记录</h2></div><span class="row-meta">最新综合得分 ${formatScore(currentStudent.latest)}</span></div><div class="timeline">${Array.from({length:5}, (_,i)=>periodCard(i)).join('')}</div></section>`;
    }
    function periodCard(index) {
      const done = index < currentStudent.completed;
      const current = index === currentStudent.completed && currentStudent.completed < 5;
      const average = done ? currentStudent.periods[index].reduce((a,b)=>a+b,0)/4 : null;
      return `<article class="period-card ${done?'done':''} ${current?'current':''}"><span class="period-number">${index+1}</span><strong>第 ${index+1} 次评估</strong><p>${done ? `完成于 202${4+Math.floor(index/2)} 年${index%2?'12':'06'}月` : current ? '等待本学期完成' : '后续学期开放'}</p>${done ? `<span class="period-score">${average.toFixed(2)}</span><br><button class="button" style="margin-top:14px" onclick="showReport(${index})">查看报告</button>` : current ? `<button class="button primary" onclick="startAssessment()">开始评估</button>` : '<span class="row-meta">尚未开放</span>'}</article>`;
    }
    function startAssessment() {
      assessmentScores = dimensions.map((dimension, d) => dimension.indicators.map((_, i) => Math.min(4, 1 + ((d + i) % 4))));
      setNav('students');
      renderAssessment();
    }
    function renderAssessment() {
      const next = Math.min(currentStudent.completed + 1, 5);
      app.innerHTML = `<button class="button ghost back" onclick="showStudent(${currentStudent.id})">← 返回学生档案</button>
      <section class="page-head"><div><p class="eyebrow">Assessment ${next} of 5</p><h1>第 ${next} 次职业素养评估</h1><p class="page-subtitle">公开演示版保留 4 个维度、20 项代表性指标。拖动评分后，右侧结果和最终报告会即时更新。</p></div></section>
      <div class="assessment-layout"><section class="panel assessment-form">${dimensions.map((dimension,d)=>dimensionHtml(dimension,d)).join('')}</section>
      <aside class="panel assessment-aside"><p class="eyebrow">Progress</p><h3>评估完成度</h3><div class="completion-ring" id="completionRing" style="--progress:100%"><strong id="completionText">100%</strong></div><div id="dimensionSummary"></div><div class="scale-note">评分说明：0 表示尚不能完成，4 表示可以稳定、独立地完成。公开演示指标仅用于展示产品交互。</div><div class="aside-actions"><button class="button primary" onclick="generateReport()">生成评估报告</button><button class="button" onclick="resetAssessment()">重置示例评分</button></div></aside></div>`;
      updateAssessmentSummary();
    }
    function dimensionHtml(dimension,d) {
      return `<section class="dimension" style="--dimension:${dimension.color}"><div class="dimension-head"><div class="dimension-title"><i class="dimension-color"></i><div><h3>D${d+1} · ${dimension.name}</h3><p>${dimension.description}</p></div></div><span class="dimension-average" id="avg-${d}">0.00</span></div>${dimension.indicators.map((indicator,i)=>`<div class="indicator"><label for="score-${d}-${i}">${indicator}<small>示例指标 ${d+1}.${i+1}</small></label><input id="score-${d}-${i}" type="range" min="0" max="4" step="1" value="${assessmentScores[d][i]}" oninput="changeScore(${d},${i},this.value)"><output class="score-badge" id="badge-${d}-${i}">${assessmentScores[d][i]}</output></div>`).join('')}</section>`;
    }
    function changeScore(d,i,value) { assessmentScores[d][i] = Number(value); document.getElementById(`badge-${d}-${i}`).textContent = value; updateAssessmentSummary(); }
    function currentAverages() { return assessmentScores.map(scores => scores.reduce((a,b)=>a+b,0)/scores.length); }
    function updateAssessmentSummary() {
      const averages = currentAverages();
      averages.forEach((value,d)=>document.getElementById(`avg-${d}`).textContent = value.toFixed(2));
      document.getElementById('dimensionSummary').innerHTML = averages.map((value,d)=>`<div class="legend-item" style="--legend:${dimensions[d].color}"><span><i></i>${dimensions[d].short}</span><strong>${value.toFixed(2)}</strong></div>`).join('');
    }
    function resetAssessment() { assessmentScores = dimensions.map(d=>d.indicators.map(()=>2)); renderAssessment(); showToast('评分已重置为 2 分'); }
    function generateReport() { showReport('custom'); showToast('评估报告已生成'); }
    function showReport(periodIndex) {
      reportMode = 'current';
      const values = periodIndex === 'custom' ? currentAverages() : (currentStudent.periods[periodIndex] || currentAverages());
      currentReportValues = values;
      const overall = values.reduce((a,b)=>a+b,0)/values.length;
      const strongest = values.indexOf(Math.max(...values));
      const focus = values.indexOf(Math.min(...values));
      app.innerHTML = `<button class="button ghost back" onclick="showStudent(${currentStudent.id})">← 返回学生档案</button>
      <section class="report-cover"><div class="report-cover-top"><div><p class="eyebrow">Vocational assessment report</p><h1>职业发展评估报告</h1></div><span class="report-tag">第 ${periodIndex === 'custom' ? Math.min(currentStudent.completed+1,5) : Number(periodIndex)+1} 次评估</span></div><div class="report-meta"><div><span>学生姓名</span><strong>${currentStudent.name}</strong></div><div><span>就读学校</span><strong>${currentStudent.school}</strong></div><div><span>班级</span><strong>${currentStudent.grade}</strong></div><div><span>班主任</span><strong>${currentStudent.teacher}</strong></div><div><span>综合得分</span><strong>${overall.toFixed(2)} / 4.00</strong></div></div></section>
      <div class="report-tabs"><button class="report-tab active" onclick="switchReportTab('current',this)">本次评估</button><button class="report-tab" onclick="switchReportTab('trend',this)">成长趋势</button><button class="button" style="margin-left:auto" onclick="window.print()">打印 / 保存 PDF</button></div>
      <div id="reportCurrent"><section class="report-grid"><article class="panel chart-card"><p class="eyebrow">Dimension profile</p><h2>四维能力画像</h2><canvas id="radar" width="600" height="420" aria-label="四维能力雷达图"></canvas><div class="dimension-legend">${values.map((value,d)=>`<div class="legend-item" style="--legend:${dimensions[d].color}"><span><i></i>${dimensions[d].short}</span><strong>${value.toFixed(2)}</strong></div>`).join('')}</div></article><article class="panel summary-card"><p class="eyebrow">Summary</p><h2>评估摘要</h2><blockquote>${currentStudent.name}本次四个维度的平均得分为 ${overall.toFixed(2)}。相对优势集中在“${dimensions[strongest].name}”，下一阶段建议优先支持“${dimensions[focus].name}”，并将目标拆解到真实任务中持续观察。</blockquote><div class="insight-list"><div class="insight"><strong>优势维度 · ${dimensions[strongest].name}</strong><p>在当前支持条件下表现较稳定，可尝试增加任务复杂度与独立完成机会。</p></div><div class="insight"><strong>优先支持 · ${dimensions[focus].name}</strong><p>建议选择 1–2 个具体行为目标，通过图示步骤、情境练习和每周反馈持续强化。</p></div><div class="insight"><strong>下一步行动</strong><p>由教师、学生与家庭共同确认目标，在下一次评估中对照变化，而不是只保留一份学期末报告。</p></div></div></article></section></div>
      <div id="reportTrend" hidden><section class="panel trend-panel"><p class="eyebrow">Longitudinal comparison</p><h2>五次评估成长趋势</h2><p class="page-subtitle">把多学期结果放在同一坐标中，帮助教师识别稳定成长、波动和下一阶段支持重点。</p><canvas id="trend" width="1100" height="380" aria-label="五次评估趋势图"></canvas></section></div>`;
      requestAnimationFrame(()=>drawRadar(values));
    }
    function switchReportTab(mode,button) {
      reportMode = mode;
      document.querySelectorAll('.report-tab').forEach(tab=>tab.classList.toggle('active',tab===button));
      document.getElementById('reportCurrent').hidden = mode !== 'current';
      document.getElementById('reportTrend').hidden = mode !== 'trend';
      if (mode === 'trend') requestAnimationFrame(drawTrend);
    }
    function canvasSetup(canvas) {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
      const ctx = canvas.getContext('2d'); ctx.scale(ratio,ratio); return {ctx,w:rect.width,h:rect.height};
    }
    function drawRadar(values) {
      const canvas = document.getElementById('radar'); if (!canvas) return;
      const {ctx,w,h} = canvasSetup(canvas); const cx=w/2, cy=h/2+8, radius=Math.min(w,h)*.34;
      ctx.clearRect(0,0,w,h); ctx.font='12px PingFang SC'; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let level=1;level<=4;level++){ ctx.beginPath(); values.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/2,r=radius*level/4,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.strokeStyle='#dfd5cf';ctx.stroke(); }
      values.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*radius,cy+Math.sin(a)*radius);ctx.strokeStyle='#e9dfda';ctx.stroke();const lx=cx+Math.cos(a)*(radius+32),ly=cy+Math.sin(a)*(radius+24);ctx.fillStyle='#665e5a';ctx.fillText(dimensions[i].short,lx,ly)});
      ctx.beginPath(); values.forEach((value,i)=>{const a=-Math.PI/2+i*Math.PI/2,r=radius*value/4,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(159,32,38,.16)';ctx.fill();ctx.strokeStyle='#9f2026';ctx.lineWidth=2.5;ctx.stroke();
      values.forEach((value,i)=>{const a=-Math.PI/2+i*Math.PI/2,r=radius*value/4;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,4,0,Math.PI*2);ctx.fillStyle=dimensions[i].color;ctx.fill()});
    }
    function drawTrend() {
      const canvas=document.getElementById('trend'); if(!canvas)return; const {ctx,w,h}=canvasSetup(canvas); const pad={l:45,r:25,t:35,b:48}; const periods=currentStudent.periods.length?currentStudent.periods:[[1.8,2,1.7,1.6],[2.2,2.4,2,1.9],[2.7,2.8,2.5,2.4]];
      ctx.clearRect(0,0,w,h);ctx.font='11px PingFang SC';ctx.textAlign='right';ctx.textBaseline='middle';
      for(let score=0;score<=4;score++){const y=pad.t+(h-pad.t-pad.b)*(1-score/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.strokeStyle='#e7ddd7';ctx.stroke();ctx.fillStyle='#827974';ctx.fillText(score.toFixed(1),pad.l-10,y)}
      dimensions.forEach((dimension,d)=>{ctx.beginPath();periods.forEach((period,i)=>{const x=pad.l+(w-pad.l-pad.r)*(i/Math.max(4,periods.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-period[d]/4);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=dimension.color;ctx.lineWidth=2.5;ctx.stroke();periods.forEach((period,i)=>{const x=pad.l+(w-pad.l-pad.r)*(i/Math.max(4,periods.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-period[d]/4);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=dimension.color;ctx.fill()})});
      ctx.textAlign='center'; for(let i=0;i<5;i++){const x=pad.l+(w-pad.l-pad.r)*(i/4);ctx.fillStyle='#746d69';ctx.fillText(`第 ${i+1} 次`,x,h-20)}
      dimensions.forEach((dimension,d)=>{ctx.textAlign='left';ctx.fillStyle=dimension.color;ctx.fillRect(pad.l+d*120,8,10,10);ctx.fillStyle='#5d5551';ctx.fillText(dimension.short,pad.l+16+d*120,13)});
    }
    window.addEventListener('resize',()=>{ if(document.getElementById('radar')) drawRadar(currentReportValues); if(reportMode==='trend'&&document.getElementById('trend')) drawTrend(); });
    const demoView = new URLSearchParams(location.search).get('view');
    if (demoView === 'report') showReport(4);
    else if (demoView === 'student') showStudent(1);
    else if (demoView === 'assessment') { currentStudent = students[1]; startAssessment(); }
    else showStudents();
  </script>
</body>
</html>
